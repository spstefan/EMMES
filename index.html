  <body>
    <h1>EMMES</h1>
    <div class="container" id="main-container">

      <div class="box" id="stats-box"> 
        <div id="username">
          <h1>Hi User!</h1>
        </div>
        <div class="stats">
          <div class="currency">
            <p>c1: 2180</p>
            <p>c2: 410</p>
            <p>c3: 35</p>
          </div>
          <p>Daily Streak: 18</p>
          <p>weekly completion bar:</p>
          <p>:::::::::::::::::::::::::::::::::</p>
          <p>Longest streak: 34</p>
          <p>Github-like Activity Heatmap</p>
          <p>maybe milestone heatmap</p>

          <p>avg time to completion</p>
          
        </div>
      </div>

      <div class="box" id="content-box">
        <div class="tab-buttons">
          <button class="tab-button" id="daily-button">daily</button>
          <button class="tab-button" id="weekly-button">weekly</button>
          <button class="tab-button" id="milestones-button">milestones</button>
          <button class="tab-button" id="store-button">store</button>
        </div>

        <div class="tab-containers"> 

          <div class="tab-content" id="daily-tab">
            <ul class="task-list">
              <li class="task">
                <div class="task-data"> 
                  <p>buy catfood</p>
                  <p>50</p>
                </div>
                <button class="delete-button">X</button>
              </li>
              <li class="task">
                <div class="task-data"> 
                  <p>buy catfood</p>
                  <p>50 coins</p>
                </div>
                <button class="delete-button">X</button>
              </li>
            </ul>
            <form class="task-input-bar" id="daily-form">
              <input type="text" id="daily-description" placeholder="Write a new task...">
              <input type="text" id="daily-reward" placeholder="Set a reward...">
              <button type="submit">Add Task</button>
            </form>
          </div>

          <div class="tab-content" id="weekly-tab" hidden>
            <ul class="task-list"></ul>
            <form class="task-input-bar" id="weekly-form">
              <input type="text" id="weekly-description" placeholder="desc">
              <input type="text" id="weekly-reward" placeholder="reward">
              <button type="submit">Add Task</button>
            </form>
          </div>

          <div class="tab-content" id="milestones-tab" hidden>
            <ul class="task-list"></ul>
            <form class="task-input-bar" id="milestones-form">
              <input type="text" id="milestones-description" placeholder="desc">
              <input type="text" id="milestones-reward" placeholder="reward">
              <button type="submit">Add Task</button>
            </form>
          </div>

          <div class="tab-content" id="store-tab" hidden>
          </div>

        </div>
